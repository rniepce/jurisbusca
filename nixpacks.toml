[phases.setup]
nixPkgs = ["nodejs_22", "python311", "ghostscript"]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "cd frontend && npm ci"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

# Variables are injected via Railway env vars — never hardcode keys here

[start]
cmd = "bash start.sh"
